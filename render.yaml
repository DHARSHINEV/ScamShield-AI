# Render Infrastructure Blueprint for ScamShield AI
# Deploy both Backend FastAPI Service and Next.js Frontend with one click

services:
  # -------------------------------------------------------------
  # 1. ScamShield AI Backend (FastAPI + ML + Vision Engines)
  # -------------------------------------------------------------
  - type: web
    name: ScamShield-AI
    env: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: HOST
        value: 0.0.0.0
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: LLM_PROVIDER
        value: local

  # -------------------------------------------------------------
  # 2. ScamShield AI Frontend (Next.js 16 + React 19 + Tailwind)
  # -------------------------------------------------------------
  - type: web
    name: scamshield-frontend
    env: node
    region: oregon
    plan: starter
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    startCommand: "npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ScamShield-AI
          property: host
